<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#141b27"><title>SAKE TIER PARTY</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SAKE TIER"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#f4f0e9;background:#141b27}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{background:#344154;color:#fff;border:1px solid #556276;border-radius:10px;padding:9px 12px;cursor:pointer}button:disabled{opacity:.4}button.active{background:#d6b77c;color:#1a2230;font-weight:800}button:focus-visible,input:focus-visible{outline:2px solid #e8c88c}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:#1d2736;position:sticky;top:0;z-index:5;border-bottom:1px solid #354357}.brand{font-size:19px;font-weight:800}.sub{font-size:11px;color:#e6c889;letter-spacing:.09em}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.status{font-size:12px;color:#a9e1c2}main{padding:10px 14px 25px;max-width:1500px;margin:auto}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.board{background:#232f40;border:1px solid #46556b;border-radius:13px;padding:9px;min-width:0}.boardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.boardhead b{font-size:15px}.count{font-size:11px;color:#aab7c8}.tier{display:grid;grid-template-columns:32px minmax(0,1fr);gap:5px;margin:4px 0;min-height:38px}.tiername{display:grid;place-items:center;border-radius:7px;color:#20252e;font-weight:900}.dropzone{border:1px dashed #4c5c71;background:#303e51;border-radius:7px;display:flex;align-content:flex-start;align-items:center;flex-wrap:wrap;gap:4px;padding:4px;min-height:38px;transition:background .1s,border-color .1s}.dropzone.over{background:#536c81;border-color:#f4d58e}.chip{border:1px solid #7c8da5;background:#53637a;border-radius:7px;color:white;font-size:11px;line-height:1.2;padding:6px 7px;max-width:100%;overflow-wrap:anywhere;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.chip:active{cursor:grabbing}.tray{background:#232f40;border:1px solid #4a596e;border-radius:13px;margin-top:10px;padding:10px}.trayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.trayitems{display:flex;gap:7px;flex-wrap:wrap}.tray .chip{font-size:12px;background:#3d4b61;padding:9px 11px}.hint,.muted{font-size:12px;color:#aab8ca}.hint{margin:8px 0}.panel{background:#232f40;border:1px solid #46556b;border-radius:13px;padding:15px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input{background:#121b29;color:#fff;border:1px solid #64738b;border-radius:8px;padding:9px}.settingsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.settingitem{background:#2e3a4d;padding:10px;border-radius:9px}.settingitem button{margin-top:6px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{border-bottom:1px solid #435169;padding:10px 8px;text-align:left}th{color:#e6c889}.pill{padding:4px 9px;border-radius:6px;color:#1b2531;font-weight:800;display:inline-block}.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.9;transform:translate(-50%,-50%);box-shadow:0 12px 35px #0009;max-width:200px}.selected{outline:2px solid #e6c889}.notice{color:#f0c9a5}.hidden{display:none!important}.dialog{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:15px}.dialogbody{background:#273449;border:1px solid #6d7e97;border-radius:14px;padding:18px;width:min(460px,100%)}.rankbuttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.rankbuttons button{min-width:50px}.footer{font-size:12px;color:#9eafc4;margin:12px 2px}.summary{display:flex;gap:8px;flex-wrap:wrap}.summary span{background:#344357;border-radius:9px;padding:9px}.fullbutton{background:#526784}.small{font-size:12px}.no-select{user-select:none;-webkit-user-select:none} @media(max-width:650px){header{position:static;align-items:flex-start;flex-direction:column}.boards{grid-template-columns:1fr}.brand{font-size:17px}.settingsgrid{grid-template-columns:1fr}}@media(min-width:800px) and (orientation:landscape){.board{padding:7px 9px}.tier{min-height:34px}.dropzone{min-height:34px}.chip{padding:5px 6px}}
</style></head><body><header><div><div class="sub">SAKE NIGHT · 4 PLAYERS</div><div class="brand">🍶 SAKE TIER PARTY <span class="small">v0.3 PWA</span></div></div><div class="tools"><span class="status" id="status" aria-live="polite">準備中</span><button id="undo">↶ 元に戻す</button><button id="backup">⬇ バックアップ</button></div></header><main><nav id="tabs"></nav><section id="app"></section><p class="footer">評価変更ごとに端末内へ自動保存。Safariのプライベートモードやサイトデータ削除には対応できないため、開始前・終了後はJSONバックアップを保存してください。同じURL・同じ起動方法で開き直すことが重要です。ホーム画面アプリとSafariでは保存領域が分かれる場合があります。</p></main><div id="dialog" class="dialog hidden"><div class="dialogbody" id="dialogbody"></div></div><script>
'use strict';
const STORAGE='sake-tier-party-v02';const OLD='sake-tier-party-v1';const ranks=['S','A','B','C','D'];const colors={S:'#eaa6a7',A:'#f1c28e',B:'#f3de9d',C:'#b8d8c2',D:'#b9c9e7'};
const initial=[['光栄菊','幾望'],['大嶺','3粒'],['大嶺','西都の雫'],['天美','長州山田錦'],['楽器正宗','FUZZY GREEN'],['雨降','桃色純米'],['雨後の月','愛山'],['ねね',''],['産土','山田錦'],['栄光富士','アルケミスト'],['飛鸞',''],['司牡丹','CEL24']].map((a,i)=>({id:i+1,brand:a[0],name:a[1]}));
const defaults=()=>({sakes:initial.map(s=>({...s})),people:['ゲスト1','ゲスト2','ゲスト3','ゲスト4'],ratings:{},notes:{}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const title=s=>[s.brand,s.name].filter(Boolean).join(' ');const rk=(p,id)=>p+'_'+id;
function valid(d){return d&&Array.isArray(d.sakes)&&d.sakes.length<=100&&d.sakes.every(s=>Number.isSafeInteger(s.id)&&typeof s.brand==='string'&&typeof s.name==='string')&&new Set(d.sakes.map(s=>s.id)).size===d.sakes.length&&Array.isArray(d.people)&&d.people.length===4&&d.people.every(x=>typeof x==='string')&&d.ratings&&typeof d.ratings==='object'&&!Array.isArray(d.ratings)&&Object.values(d.ratings).every(v=>ranks.includes(v))&&(!d.notes||typeof d.notes==='object')};
let data=defaults(),startupError='';try{const raw=localStorage.getItem(STORAGE)||localStorage.getItem(OLD);if(raw){const parsed=JSON.parse(raw);if(valid(parsed)){data=parsed;data.notes??={}}else startupError='保存データの形式を確認できませんでした。バックアップを読み込んでください。'}}catch(e){startupError='保存データを読めませんでした。バックアップを読み込んでください。'}
let tab='board',selected=null,history=[],lastSaved='';const $=id=>document.getElementById(id);const get=(p,id)=>data.ratings[rk(p,id)]||'';const status=(s,error=false)=>{const e=$('status');e.textContent=s;e.style.color=error?'#ffb0a9':'#a9e1c2'};
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(data));lastSaved=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});status('✓ 保存済み '+lastSaved);return true}catch(e){status('⚠ 保存失敗・バックアップしてください',true);return false}}
function change(fn){const before=JSON.stringify(data);fn();if(JSON.stringify(data)===before)return;history.push(before);if(history.length>30)history.shift();persist();render()}
function rate(p,id,r){if(p<0||p>3||!data.sakes.some(s=>s.id===id)||!(ranks.includes(r)||r===''))return;change(()=>{if(r)data.ratings[rk(p,id)]=r;else delete data.ratings[rk(p,id)]})}
function undo(){if(!history.length)return;data=JSON.parse(history.pop());persist();render()}
function closeDialog(){$('dialog').classList.add('hidden');selected=null}function choose(p,id){selected={p,id};const s=data.sakes.find(s=>s.id===id);if(!s)return;const current=p===null?'':get(p,id);$('dialogbody').innerHTML=`<h3 style="margin-top:0">${esc(title(s))}</h3><p class="muted">${p===null?'評価する人を選んでね':'評価先：'+esc(data.people[p])}</p>${p===null?`<div class="rankbuttons">${data.people.map((n,i)=>`<button data-personpick="${i}">${esc(n)}</button>`).join('')}</div>`:`<div class="rankbuttons">${ranks.map(r=>`<button data-choose="${r}" class="${current===r?'active':''}" style="border-color:${colors[r]}">${r}</button>`).join('')}<button data-choose="">未評価に戻す</button></div>`}<button id="closeDialog">閉じる</button>`;$('dialog').classList.remove('hidden');$('closeDialog').onclick=closeDialog;$('dialogbody').querySelectorAll('[data-personpick]').forEach(b=>b.onclick=()=>choose(+b.dataset.personpick,id));$('dialogbody').querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>{rate(p,id,b.dataset.choose);closeDialog()})}
function chip(s,p=null){return `<button class="chip" data-chip="${s.id}" data-owner="${p===null?'tray':p}" title="${esc(title(s))}">${esc(title(s))}</button>`}
function board(){return `<div class="hint">下の共通トレイから各人のS〜Dにドラッグするとコピーされるよ。配置済みカードは移動可能。タップ操作でも評価できる。</div><div class="boards">${data.people.map((n,p)=>`<section class="board"><div class="boardhead"><b>${esc(n)}</b><span class="count">${data.sakes.filter(s=>get(p,s.id)).length}/${data.sakes.length} 評価済</span></div>${ranks.map(r=>`<div class="tier"><div class="tiername" style="background:${colors[r]}">${r}</div><div class="dropzone" data-drop-person="${p}" data-drop-rank="${r}">${data.sakes.filter(s=>get(p,s.id)===r).map(s=>chip(s,p)).join('')}</div></div>`).join('')}</section>`).join('')}</div><section class="tray"><div class="trayhead"><b>🍶 共通銘柄トレイ（ドラッグでコピー）</b><button id="trayToggle" class="small">折りたたむ</button></div><div id="trayitems" class="trayitems">${data.sakes.map(s=>chip(s)).join('')}</div></section>`}
function list(){return `<section class="panel"><h2>共通の日本酒リスト</h2><p class="muted">銘柄は全員共通。編集は設定画面から。</p><div class="settingsgrid">${data.sakes.map(s=>`<div class="settingitem"><b>${esc(title(s))}</b><div class="muted">${data.people.map((n,p)=>esc(n)+'：'+(get(p,s.id)||'–')).join(' ／ ')}</div></div>`).join('')}</div></section>`}
function compare(){const rows=data.sakes.map(s=>{const vals=data.people.map((_,p)=>get(p,s.id));const nums=vals.filter(Boolean).map(r=>5-ranks.indexOf(r));return{s,vals,count:nums.length,avg:nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null,spread:nums.length>1?Math.max(...nums)-Math.min(...nums):0}}).sort((a,b)=>(b.avg??-1)-(a.avg??-1));return `<section class="panel"><h2>📊 4人比較</h2><p class="muted">S=5点、A=4点、B=3点、C=2点、D=1点。未評価の人は平均から除外。</p><div class="summary"><span>全員評価済み：${rows.filter(o=>o.count===4).length}/${rows.length}</span><span>意見が割れた銘柄：${rows.filter(o=>o.count===4&&o.spread>=3).length}</span></div><div class="tablewrap"><table><thead><tr><th>銘柄</th>${data.people.map(n=>`<th>${esc(n)}</th>`).join('')}<th>平均 / 人数</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${esc(title(o.s))}${o.count===4&&o.spread>=3?' 🔥':''}</td>${o.vals.map(v=>`<td>${v?`<span class="pill" style="background:${colors[v]}">${v}</span>`:'—'}</td>`).join('')}<td>${o.avg===null?'—':o.avg.toFixed(2)} <span class="muted">(${o.count}/4)</span></td></tr>`).join('')}</tbody></table></div><p class="muted">🔥 は4人全員が評価し、最高・最低評価に3段階以上の差がある銘柄。</p></section>`}
function settings(){return `<section class="panel"><h2>⚙️ 参加者名</h2><div class="settingsgrid">${data.people.map((n,p)=>`<label class="field">参加者${p+1}<input data-person-name="${p}" maxlength="30" value="${esc(n)}"></label>`).join('')}</div></section><section class="panel"><h2>🍶 銘柄を編集</h2><div class="settingsgrid">${data.sakes.map(s=>`<div class="settingitem"><label class="field">酒蔵・ブランド<input data-brand="${s.id}" maxlength="60" value="${esc(s.brand)}"></label><label class="field">銘柄・種類<input data-sakename="${s.id}" maxlength="60" value="${esc(s.name)}"></label><button data-delete="${s.id}">この銘柄を削除</button></div>`).join('')}</div><h3>銘柄を追加</h3><div class="row"><input id="newbrand" placeholder="酒蔵・ブランド" style="padding:9px"><input id="newname" placeholder="銘柄・種類" style="padding:9px"><button id="addSake">＋ 追加</button></div></section><section class="panel"><h2>💾 データ管理</h2><p class="muted">JSONファイルから復元すると現在の評価は置き換わります。復元前にバックアップがおすすめ。</p><div class="row"><button id="importBtn">バックアップから復元</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"><button id="resetBtn">すべて初期化</button></div><p class="notice">Safariで「ファイル」アプリから直接HTMLを開く場合、保存の継続性が保証されません。公開URLに配置して、同じURLから使うことを推奨します。</p></section>`}
function render(){const labels=[['board','🏠 4人ティア表'],['list','🍶 共通リスト'],['compare','📊 4人比較'],['settings','⚙️ 設定']];$('tabs').innerHTML=labels.map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('');$('app').innerHTML=({board,list,compare,settings})[tab]();$('undo').disabled=!history.length;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if(tab==='board')bindBoard();if(tab==='settings')bindSettings()}
function bindBoard(){let trayVisible=true;$('trayToggle').onclick=()=>{trayVisible=!trayVisible;$('trayitems').classList.toggle('hidden',!trayVisible);$('trayToggle').textContent=trayVisible?'折りたたむ':'トレイを開く'};document.querySelectorAll('[data-chip]').forEach(el=>{el.addEventListener('pointerdown',startDrag);el.addEventListener('click',()=>{if(Date.now()<suppressClickUntil)return;const p=el.dataset.owner==='tray'?null:+el.dataset.owner;choose(p,+el.dataset.chip)})})}
let drag=null,suppressClickUntil=0;function startDrag(e){if(e.button!==0||drag)return;const source=e.currentTarget;const startX=e.clientX,startY=e.clientY;drag={source,id:+source.dataset.chip,owner:source.dataset.owner,x:startX,y:startY,startX,startY,moved:false,ghost:null,pointerId:e.pointerId};source.setPointerCapture(e.pointerId);source.addEventListener('pointermove',moveDrag);source.addEventListener('pointerup',endDrag);source.addEventListener('pointercancel',cancelDrag)}
function moveDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;drag.x=e.clientX;drag.y=e.clientY;if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<8)return;if(!drag.moved){drag.moved=true;const ghost=drag.source.cloneNode(true);ghost.classList.add('ghost');ghost.removeAttribute('data-chip');document.body.appendChild(ghost);drag.ghost=ghost}drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';document.querySelectorAll('.dropzone.over').forEach(z=>z.classList.remove('over'));const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.dropzone');if(z)z.classList.add('over')}
function finishDrag(e,cancel=false){if(!drag)return;const d=drag;drag=null;d.source.removeEventListener('pointermove',moveDrag);d.source.removeEventListener('pointerup',endDrag);d.source.removeEventListener('pointercancel',cancelDrag);try{d.source.releasePointerCapture(d.pointerId)}catch{}document.querySelectorAll('.dropzone.over').forEach(z=>z.classList.remove('over'));d.ghost?.remove();if(d.moved){suppressClickUntil=Date.now()+400;if(!cancel){const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.dropzone');if(z)rate(+z.dataset.dropPerson,d.id,z.dataset.dropRank)}}}function endDrag(e){finishDrag(e)}function cancelDrag(e){finishDrag(e,true)}
function bindSettings(){document.querySelectorAll('[data-person-name]').forEach(e=>e.onchange=()=>change(()=>data.people[+e.dataset.personName]=e.value.trim()||'ゲスト'));document.querySelectorAll('[data-brand]').forEach(e=>e.onchange=()=>change(()=>data.sakes.find(s=>s.id===+e.dataset.brand).brand=e.value.trim()||'未設定'));document.querySelectorAll('[data-sakename]').forEach(e=>e.onchange=()=>change(()=>data.sakes.find(s=>s.id===+e.dataset.sakename).name=e.value.trim()));document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{if(!confirm('この銘柄と全員の評価を削除しますか？'))return;const id=+e.dataset.delete;change(()=>{data.sakes=data.sakes.filter(s=>s.id!==id);for(let p=0;p<4;p++){delete data.ratings[rk(p,id)];delete data.notes[rk(p,id)]}})});$('addSake').onclick=()=>{const brand=$('newbrand').value.trim(),name=$('newname').value.trim();if(!brand)return alert('酒蔵・ブランドを入力してください');if(data.sakes.length>=100)return alert('銘柄は100件までです');change(()=>data.sakes.push({id:Math.max(0,...data.sakes.map(s=>s.id))+1,brand,name}))};$('resetBtn').onclick=()=>{if(confirm('4人分の評価を含むすべてのデータを初期化します。よろしいですか？'))change(()=>Object.assign(data,defaults()))};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>2e6)throw Error('ファイルが大きすぎます');const parsed=JSON.parse(await f.text());if(!valid(parsed))throw Error('バックアップ形式が正しくありません');if(!confirm('現在のデータをバックアップで置き換えますか？'))return;change(()=>{data=parsed;data.notes??={}});alert('復元しました')}catch(err){alert('復元できませんでした：'+err.message)}finally{e.target.value=''}}}
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({ ...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sake-tier-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};$('undo').onclick=undo;$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});render();if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}if(startupError)status('⚠ '+startupError,true);else persist();
</script></body></html>
